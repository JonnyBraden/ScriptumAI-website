<style>
/* VOICE work: a shipped product screen inside the Scriptum portal

:root{color-scheme:light dark;--bg:light-dark(#EEECE7,#12161d);--card:light-dark(#FCFBF8,#1b2029);--ink:light-dark(#1D2434,#ECEAE4);--mute:light-dark(#5F6372,#A6AAB6);--line:light-dark(#DFDBD3,#313846);--btn:light-dark(#464F6D,#9AA5CF);--btnink:light-dark(#ffffff,#0f131a);--acc:light-dark(#A84E2A,#EBA081);--accbg:light-dark(#F5E5DC,#3b2920);--ok:light-dark(#0E7754,#62CDA3);--okbg:light-dark(#E1F0E9,#16302a);--bad:light-dark(#A72420,#F29590);--amb:light-dark(#704800,#F2C46D);--ambbg:light-dark(#FBEFD6,#362c18);--soft:light-dark(#F4F2ED,#232935);--side:#101928}

*{box-sizing:border-box;min-width:0}

.demo{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;padding:8px max(2vw,16px);background:var(--ambbg);color:var(--amb);font-size:13px;border-bottom:1px solid var(--line)}

.app{display:grid;grid-template-columns:216px minmax(0,1fr);min-height:calc(100vh - 44px)}

.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}

.askbox input{flex:1 1 220px}
.esc{background:var(--ambbg);color:var(--amb);border-radius:8px;padding:12px 14px;margin-top:10px;font-size:14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.esc p{margin:0;flex:1 1 100%}
.qbox{background:var(--card);border:1px solid var(--line);border-radius:12px;margin:24px 0 16px}

.q{border-top:1px solid var(--line);padding:14px 16px}

.foot .cnt{font-weight:600;font-size:14px}
.fa{display:flex;flex-wrap:wrap;gap:6px}
.insp{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;font-size:13px;position:sticky;top:16px}

.insp dl{margin:0;display:grid;gap:10px}
.insp dt{font-weight:600;color:var(--mute);font-size:12px}
.insp dd{margin:0}
.big{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}

.mhead{margin-bottom:14px}
.tabs{display:flex;gap:4px;overflow-x:auto;margin-top:12px}
.tab{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:6px 14px;font-size:13px;white-space:nowrap;min-height:36px}
.tab.on{background:var(--btn);color:var(--btnink);border-color:var(--btn)}
.vstrip{display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin-bottom:16px;font-size:13px}
.vc{padding:3px 9px;border-radius:6px;background:var(--soft);white-space:nowrap}
.vc.cur{background:var(--btn);color:var(--btnink)}
.vs-r{margin-left:auto;font-weight:600;color:var(--acc)}
.mx{display:grid;grid-template-columns:220px minmax(0,1fr) 250px;gap:20px;align-items:start}

.lead{font-size:17px;margin:0 0 10px}

<div id="root"></div>
<script>
{
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const P={associate:'Sam Patel',partner:'Ruth Okafor'};
const TICK='<svg width="12" height="12" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8.5l3 3 7-7" fill="none" stroke="currentColor" stroke-width="2.4"/></svg>';
const LOCK='<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><rect x="3" y="7" width="10" height="7" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M5.5 7V5a2.5 2.5 0 015 0v2" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>';
const CLIENTS=['Nimbus Health','Lumen Bio','Northgate Ventures','Kestrel Robotics'];
const LIM=['12%','£25,000'];

function vKestrel(){const k=S.ks,steps=ksSteps(),vs=[['v1 Your draft'],['v2 Lex & Co'],['v3 Your draft'],['v4 Lex & Co',!k.sent]].concat(k.sent?[['v5 Your draft',1]]:[]);
const sel=k.view&&steps.find(s=>s.id===k.view);
const nk=nDec('ks')+(k.issues?1:0)+(k.email==='approved'?1:0);
return mhead('Project Kestrel: Series A','Northgate Ventures · We act for the Investor · Lex & Co act for Kestrel Robotics')+vstrip(vs,k.sent?'Waiting on Lex & Co':'Your move: respond to v4')+`<div class="mx">${rail('ks',steps)}<div>${sel?readOnly('ks',sel,KSUM[sel.id]):ksMain()}</div>${insp([['Reads','v4 from Lex & Co, their covering email, the limits Ruth Okafor approved, the issues list'],['Model','Fable proposes moves. Sonnet reads their markup.'],['Who sees what',"Your team's lawyers only. Lex & Co sees only what you send. Northgate sees only notes you approve."],['Decisions so far',`${41+nk} by people, 0 by agents`],['Spend on this document','£3.84',1]])}</div>`}
function ksMain(){const k=S.ks;
const sh=`<div class="stephead"><span class="actor">Negotiation agent</span><span class="sn">Turn 2</span><h2>Respond to v4</h2><p>Lex & Co sent v4 with replies on 4 points. The agent checked each reply against the limits Ruth Okafor approved, and proposed a move or escalated where a reply is outside them.</p><div class="ctl">${B('doc','ks','View document',{cls:'ghost'})}${B('iss','ks','Issues list',{cls:'ghost'})}</div></div>`;
if(k.sent)return `<div class="stephead"><span class="actor">Lex & Co</span><span class="sn">Turn 3</span><h2>Waiting on Lex & Co</h2><p>v5 is recorded as sent. When v6 arrives, Turn 3 opens. Nothing runs on its own: you choose to respond with the agents or by hand, point by point.</p></div>`;
if(S.plan!=='pro')return sh+'<p class="note">The negotiation agent is on Pro. Respond to v4 by hand, or switch Plan to Pro in the bar above.</p>';
const nk=nDec('ks')+(k.issues?1:0)+(k.email==='approved'?1:0),all=nk===6;
return sh+gate('Nothing reaches Lex & Co until you approve each item below and send v5 yourself.')+`<section class="log"><div class="lh"><b>Negotiation agent</b><span>Complete</span></div><ol><li class="ok">Read v4 and the covering email from Lex & Co</li><li class="ok">Checked 4 replies against Ruth Okafor's limits in code</li><li class="ok">Proposed 3 moves and escalated 1</li><li class="ok">Updated the issues list and drafted a covering email</li></ol></section>
<h3 class="bh">1. Counter wording</h3>${sections('ks')}
<h3 class="bh">2. Updated issues list</h3>${ksIssues()}
<h3 class="bh">3. Covering email to Lex & Co</h3>${ksEmail()}
${ksQBox()}

function ksRows(){const st=i=>S.ks.dec[i.id]?(S.ks.dec[i.id].v==='reject'?'Holding our wording':'Counter ready'):i.esc&&!S.ks.esc?'With Ruth Okafor':'Open';return KS.map(i=>[i.ref+' '+i.title,i.int,st(i),ksCounter(i)||i.ours,i.theirs]).concat([['7.1 Drag-along','High','Agreed in v3','75% of all Shares','75% of all Shares'],['11.2 Consent matters','Medium','Agreed in v3','Schedule 3 list','Schedule 3 list']])}
function issTable(rows){return `<div class="scroll tbl"><table><thead><tr><th>Point</th><th>Intensity</th><th>Status</th><th>Our position</th><th>Their position</th></tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
function ksIssues(){const k=S.ks;return issTable(ksRows())+`<p class="wait">Internal. The issues list is never sent to Lex & Co from Scriptum. Download a client version for Northgate if you want one.</p>${k.issues?`<p class="dn">${TICK} Approved by ${esc(k.issues)} ${B('undoiss','','Change',{cls:'link'})}</p>`:`<div class="ctl">${B('issok','','Approve issues list',{c:'Confirm approve',cls:'pri'})}${B('dl','','Download as Word',{cls:'ghost'})}</div>`}`}
function ksEmail(){const k=S.ks,st=k.email;let body;
if(st==='editing')body=`<label class="lab" for="em">Email text</label><textarea id="em" data-m="em" rows="13">${esc(F.em??k.emailText)}</textarea>${k.emErr?`<p class="err">${esc(k.emErr)}</p>`:''}<div class="ctl">${B('emsave','','Save',{cls:'pri'})}${B('emcancel','','Cancel',{cls:'ghost'})}</div>`;
else body=`<pre>${esc(k.emailText)}</pre>${st==='approved'?`<p class="dn">${TICK} Approved by ${esc(k.emBy)}</p><div class="ctl">${B('copy','','Copy')}${B('openmail','','Open in email')}</div>`:`<div class="ctl">${B('emok','','Approve',{c:'Confirm approve',cls:'pri'})}${B('emedit','','Edit',{cls:'ghost'})}</div>`}`;
return `<div class="email">${gate("Scriptum never sends this. Check it does not reveal your client's limits before you send it.")}<p class="meta">To: Lex & Co, counsel@lexandco.example · Subject: Project Kestrel, v5 of the Shareholders Agreement</p>${body}</div>`}
function ksQBox(){const k=S.ks;
const sum=`<div class="q"><div class="to">Note for Northgate Ventures · Summary of v4</div>${k.sum==='editing'?`<label class="lab" for="sm" style="margin-top:6px">Summary</label><textarea id="sm" data-m="sm" rows="5">${esc(F.sm??k.sumText)}</textarea>${k.sumErr?`<p class="err">${esc(k.sumErr)}</p>`:''}<div class="ctl">${B('smsave','','Save',{cls:'pri'})}${B('smcancel','','Cancel',{cls:'ghost'})}</div>`:`<p>${esc(k.sumText)}</p>${k.sum==='sent'?`<p class="dn">${TICK} Sent. Northgate sees it under Notes from your lawyers.</p>`:k.sum==='dismissed'?'<p class="wait">Dismissed.</p>':`<div class="ctl">${B('smok','','Approve and send',{c:'Confirm send',cls:'pri'})}${B('smedit','','Edit',{cls:'ghost'})}${B('smdis','','Dismiss',{cls:'ghost'})}</div>`}`}</div>`;
const q3=`<div class="q"><div class="to">Question for Northgate Ventures · 4.1 Liquidation preference</div><p>${esc(Q3)}</p>${k.q3==='sent'?`<p class="dn">${TICK} Sent to Northgate in the app.</p>`:k.q3==='dismissed'?'<p class="wait">Dismissed.</p>':`<div class="ctl">${B('q3ok','','Approve and send',{c:'Confirm send',cls:'pri'})}${B('q3dis','','Dismiss',{cls:'ghost'})}</div>`}</div>`;
return `<details class="qbox" open><summary>For Northgate Ventures (2)</summary>${sum}${q3}<p class="qrule">Questions can mention a figure from a partner's limits. Notes and summaries cannot: try adding 12% to the summary.</p></details>`}

smsave:()=>{const t=F.sm??S.ks.sumText,hit=LIM.find(l=>t.includes(l));if(hit){S.ks.sumErr=`Notes for the client cannot mention a partner limit (${hit}). Take it out, then save.`;return}S.ks.sumText=t;S.ks.sum='proposed';S.ks.sumErr=''},
smok:()=>{S.ks.sum='sent'},smdis:()=>{S.ks.sum='dismissed'},q3ok:()=>{S.ks.q3='sent'},q3dis:()=>{S.ks.q3='dismissed'},
sendk:()=>{S.ks.sent=true;S.ks.view=null;toast('v5 recorded as sent. Waiting on Lex & Co.')},
tpsave:()=>{S.tp.saved=true},
askfu:()=>{const q=(F.fu||'').trim();if(!q)return;S.ak.fu.push({q,a:fuAnswer(q)});F.fu=''}
};

function render(){const r=S.route;const V={new:vNew,run:vRun,review:vReview,draft:vDraft,ask:vAsk,template:vTpl,kestrel:vKestrel,osprey:vOsprey};const [sd,tn]=side();
document.getElementById('root').innerHTML=demoBar()+`<div class="app">${sd}<div>${tn}<main id="main">${(V[r]||vHome)()}</main></div></div>${drawer()}${modal()}${S.toast?`<div class="toast" role="status">${esc(S.toast)}</div>`:''}`;
try{const {pending,modal:_m,drawer:_d,toast:_t,run:_r,...keep}=S;localStorage.setItem('scr-agents-v1',JSON.stringify(keep))}catch(e){}}

document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b||b.disabled)return;const a=b.dataset.a,id=b.dataset.id||'',x=b.dataset.x||'';
if(b.dataset.c){const key=a+'|'+id+'|'+x;if(S.pending!==key){S.pending=key;render();clearTimeout(window._pt);window._pt=setTimeout(()=>{if(S.pending===key){S.pending=null;render()}},4000);return}S.pending=null}
if(A[a]){A[a](id,x);if(a!=='go'&&a!=='run')render()}});
document.addEventListener('input',e=>{const m=e.target.dataset&&e.target.dataset.m;if(m)F[m]=e.target.value});
document.addEventListener('change',e=>{const t=e.target;
if(t.id==='as'){S.as=t.value;S.sec=null;render()}
else if(t.id==='plan'){S.plan=t.value;render()}
else if(t.id==='client'){S.nt.client=t.value;render()}
else if(t.id==='tagc'){S.rv.client=t.value;render()}
else if(t.id==='aud'){S.drawer.aud=t.value;render()}
else if(t.dataset.ins){S.nt.ins[t.dataset.ins]=t.checked;render()}
else if(t.id==='fileup'&&t.files[0]){S.nt.files.push({name:t.files[0].name,type:'Unknown document type',untyped:S.nt.kind==='review'});render()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&(S.drawer||S.modal)){S.drawer=null;S.modal=null;render()}});
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1)||'home';if(h!==S.route){S.route=h;S.drawer=null;S.modal=null;render()}});
const h0=location.hash.slice(1);if(h0)S.route=h0;if(S.route==='run')S.route='home';
render();
}
</script>
