<!doctype html><html><head>
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<meta name="referrer" content="no-referrer">
<meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Scriptum Clause Library</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:ital,wght@0,400;0,500;1,400&display=swap">
<style>
/* Layout: app bar, heading tree on the left, one library entry on the right; drawers and a modal over it. Scriptum's own tokens: warm stone ground, navy ink, terracotta accent. */
:root{
  --bg:#EEECE7; --surface:#F7F6F2; --card:#FFFFFF; --ink:#1B2A41; --muted:#5E6573; --faint:#8A909B;
  --line:#D9D5CC; --line-soft:#E6E3DC; --accent:#B9573B; --accent-soft:#F3E3DC; --accent-ink:#FFFFFF;
  --held:#2E7650; --comp:#B07C25; --conc:#9B3A4E; --del:#6A6F79; --open:#3A68A0; --unk:#A7ABB3;
  --ins-bg:#DDEFE4; --ins-ink:#1E5A3A; --del-bg:#F6DEDE; --del-ink:#8A2B2B;
  --focus:#3A68A0; --shadow:0 1px 2px rgba(27,42,65,.06),0 6px 20px rgba(27,42,65,.06);
  --f-sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-serif:"IBM Plex Serif",Georgia,"Times New Roman",serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:8px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#12161D; --surface:#181D25; --card:#1F2531; --ink:#E5E8EE; --muted:#A1A9B6; --faint:#7C8494;
  --line:#313A49; --line-soft:#272F3C; --accent:#E07D60; --accent-soft:#3A2620; --accent-ink:#1B0F0B;
  --held:#5BB585; --comp:#D6A653; --conc:#D47A8D; --del:#9AA0AA; --open:#7FA7DA; --unk:#6E7480;
  --ins-bg:#1F3A2B; --ins-ink:#9BDDB5; --del-bg:#432426; --del-ink:#F0A8A8; --focus:#7FA7DA;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#12161D; --surface:#181D25; --card:#1F2531; --ink:#E5E8EE; --muted:#A1A9B6; --faint:#7C8494;
  --line:#313A49; --line-soft:#272F3C; --accent:#E07D60; --accent-soft:#3A2620; --accent-ink:#1B0F0B;
  --held:#5BB585; --comp:#D6A653; --conc:#D47A8D; --del:#9AA0AA; --open:#7FA7DA; --unk:#6E7480;
  --ins-bg:#1F3A2B; --ins-ink:#9BDDB5; --del-bg:#432426; --del-ink:#F0A8A8; --focus:#7FA7DA;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-sans);font-size:14px;line-height:1.5}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
h1,h2,h3{text-wrap:balance;margin:0}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* App bar */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.bar-in{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding-block:10px}
.brand{display:flex;align-items:baseline;gap:8px;white-space:nowrap}
.brand b{font-weight:600;letter-spacing:.01em}
.brand span{color:var(--muted)}
.ask{flex:1 1 320px;display:flex;gap:6px;min-width:0}
.ask input{flex:1;min-width:0;padding:8px 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--card)}
.bar-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--card)}
.seg button{border:0;background:none;padding:6px 10px;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.btn{border:1px solid var(--line);background:var(--card);border-radius:var(--r);padding:7px 12px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--faint)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:500}
.btn.ghost{background:none;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);border-color:var(--line)}
.btn.small{padding:4px 9px;font-size:13px}
.btn[aria-disabled="true"]{opacity:.55}
.badge{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--accent);color:var(--accent-ink);font-size:11px;font-weight:600}
.demo-note{background:var(--accent-soft);color:var(--ink);font-size:12.5px}
.demo-note .wrap{padding-block:6px}

/* Shell */
.shell{display:grid;grid-template-columns:280px minmax(0,1fr);gap:0;align-items:start}
aside{position:sticky;top:calc(env(safe-area-inset-top,0px) + 62px);max-height:calc(100vh - 62px);overflow:auto;border-right:1px solid var(--line);padding:16px 14px 40px max(16px,env(safe-area-inset-left,0px))}
main{min-width:0;padding-block:20px 60px}
.doc-tabs{display:grid;gap:2px;margin-bottom:16px}
.doc-tabs button{text-align:left;border:0;background:none;padding:7px 10px;border-radius:6px;cursor:pointer;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.doc-tabs button[aria-pressed="true"]{background:var(--card);color:var(--ink);font-weight:500;box-shadow:var(--shadow)}
.doc-tabs small{color:var(--faint);font-size:11.5px}
.eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);font-weight:500}
.tree{display:grid;gap:14px}
.tree-group{display:grid;gap:1px}
.tree-group .eyebrow{padding:0 10px 4px}
.node{display:flex;justify-content:space-between;gap:8px;width:100%;border:0;background:none;text-align:left;padding:5px 10px;border-radius:6px;cursor:pointer;color:var(--ink)}
.node:hover{background:var(--line-soft)}
.node[aria-current="true"]{background:var(--ink);color:var(--bg)}
.node[aria-current="true"] .cnt{color:inherit;opacity:.75}
.node.child{padding-left:24px;color:var(--muted);font-size:13.5px}
.node.child[aria-current="true"]{color:var(--bg)}
.cnt{font-family:var(--f-mono);font-size:11.5px;color:var(--faint);font-variant-numeric:tabular-nums}
.side-foot{margin-top:18px;padding-top:14px;border-top:1px solid var(--line);display:grid;gap:8px}
.side-foot p{margin:0;color:var(--muted);font-size:12.5px}
.inline-form{display:flex;gap:6px}
.inline-form input{flex:1;min-width:0;padding:6px 9px;border:1px solid var(--line);border-radius:6px;background:var(--card)}
.mobile-tree{display:none}
.side-tools{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:0 10px 10px;flex-wrap:wrap}
.tree{gap:4px}
.tree-group summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;gap:8px;padding:6px 10px;border-radius:6px;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:500}
.tree-group summary::-webkit-details-marker{display:none}
.tree-group summary::before{content:"▸";margin-right:2px;color:var(--faint);transition:transform .15s}
.tree-group[open] summary::before{transform:rotate(90deg)}
.tree-group summary span:first-child{flex:1}
.tree-group summary:hover{background:var(--line-soft)}
.tree-items{display:grid;gap:1px;padding:2px 0 8px}
.node.empty-node{color:var(--faint)}
.node.empty-node[aria-current="true"]{color:var(--bg)}
.firm{font-size:10.5px;padding:0 5px;border-radius:3px;background:var(--accent-soft);color:var(--accent);font-weight:600;letter-spacing:.02em}
.firm-chip{border-color:var(--accent);color:var(--accent)}
.part-form{margin:-4px 0 16px;display:grid;gap:8px}
.part-form label{font-weight:500}

/* Entry */
.crumbs{color:var(--muted);font-size:12.5px;display:flex;flex-wrap:wrap;gap:4px 6px}
.crumbs button{border:0;background:none;padding:0;color:inherit;cursor:pointer;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.entry-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin:6px 0 16px}
.entry-head h1{font-family:var(--f-serif);font-weight:500;font-size:30px;line-height:1.15}
.kind{display:inline-block;font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 9px;margin-top:8px}
.head-actions{display:flex;gap:8px;flex-wrap:wrap}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px}
.summary{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:20px;margin-bottom:14px}
.summary.single{grid-template-columns:minmax(0,1fr)}
.stat-title{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:10px}
.stack{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--line-soft)}
.stack i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:13px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.big{font-family:var(--f-serif);font-size:22px;font-weight:500}
.note{color:var(--muted);font-size:12.5px;margin:8px 0 0}
.plot svg{display:block;width:100%;height:auto;overflow:visible}
.plot text{font-family:var(--f-mono);font-size:11px;fill:var(--muted)}
.filters{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;margin:4px 0 14px}
.filters label{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:13px}
.filters select{padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--card)}
.filters .spacer{flex:1}
.check{display:inline-flex;gap:6px;align-items:center;color:var(--muted);font-size:13px;cursor:pointer}
.parts{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 16px}
.part{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:8px 12px;cursor:pointer;display:grid;gap:6px;min-width:150px;text-align:left}
.part:hover{border-color:var(--faint)}
.part .mini{display:flex;height:5px;border-radius:3px;overflow:hidden;background:var(--line-soft)}
.part .mini i{display:block;height:100%}
.part small{color:var(--muted);font-size:12px}

.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;min-width:0}
.card.prec{border-style:dashed}
.card-h{padding:12px 14px 10px;border-bottom:1px solid var(--line-soft);display:grid;gap:4px}
.card-h .row{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.card-h h3{font-size:14.5px;font-weight:600;line-height:1.3}
.meta{color:var(--muted);font-size:12.5px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:500;padding:2px 8px;border-radius:999px;white-space:nowrap;border:1px solid currentColor}
.pill.held{color:var(--held)} .pill.compromised{color:var(--comp)} .pill.conceded{color:var(--conc)}
.pill.deleted{color:var(--del)} .pill.open{color:var(--open)} .pill.unknown{color:var(--faint)} .pill.prec{color:var(--muted);border-style:dashed}
.tag{font-size:11.5px;padding:1px 7px;border-radius:4px;background:var(--accent-soft);color:var(--accent);font-weight:500;width:max-content}
.rounds{display:flex;flex-wrap:wrap;gap:4px;padding:10px 14px 0}
.rounds button{border:1px solid var(--line);background:none;border-radius:5px;padding:2px 8px;font-size:12px;font-family:var(--f-mono);cursor:pointer;color:var(--muted)}
.rounds button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.wording{padding:10px 14px 12px;font-family:var(--f-serif);font-size:14.5px;line-height:1.6;flex:1;min-width:0;overflow-wrap:anywhere}
.wording p{margin:0 0 6px}
.wording p.limb{padding-left:22px}
.wording .lead{color:var(--faint);font-style:italic;margin-bottom:8px;font-size:13.5px}
.wording .gone{color:var(--del);font-family:var(--f-sans);font-size:13px}
.wording ins{background:var(--ins-bg);color:var(--ins-ink);text-decoration:none;border-radius:2px}
.wording del{background:var(--del-bg);color:var(--del-ink);border-radius:2px}
.wording .part-label{display:block;font-family:var(--f-sans);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);margin:8px 0 2px}
.wording .part-label:first-child{margin-top:0}
.xref{border-bottom:1px dotted var(--accent);cursor:pointer}
.xref .xdef{font-family:var(--f-sans);font-size:12.5px;color:var(--muted);background:var(--surface);border:1px solid var(--line-soft);border-radius:4px;padding:1px 6px;margin:0 2px}
.xref.closed .xdef{display:none}
.card-f{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px 10px 10px;border-top:1px solid var(--line-soft)}
.card-f .val{margin-left:auto;font-family:var(--f-mono);font-size:12.5px;color:var(--ink);background:var(--surface);border:1px solid var(--line-soft);padding:2px 8px;border-radius:5px;font-variant-numeric:tabular-nums}
.linkish{border:0;background:none;padding:0;color:var(--accent);cursor:pointer;font-size:12.5px;text-align:left;text-decoration:underline;text-underline-offset:3px}
.move-row{display:flex;gap:6px;padding:0 10px 10px;flex-wrap:wrap}
.move-row select{flex:1;min-width:0;padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--card)}
.empty{color:var(--muted);padding:24px;text-align:center;border:1px dashed var(--line);border-radius:10px}

/* Answer */
.answer{margin-bottom:18px;border-left:3px solid var(--accent)}
.answer .q{color:var(--muted);font-size:13px;margin:0 0 6px}
.answer .a{font-family:var(--f-serif);font-size:21px;line-height:1.35;margin:0}
.answer .mkt{margin:10px 0 0;padding-top:10px;border-top:1px solid var(--line-soft);display:flex;gap:8px;flex-wrap:wrap;align-items:baseline}
.answer .src{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);font-weight:500}
.answer .row{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.suggest{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 11px;font-size:12.5px;cursor:pointer;color:var(--ink)}
.chip:hover{border-color:var(--faint)}

/* Definitions */
.defs{display:grid;grid-template-columns:230px minmax(0,1fr);gap:16px;align-items:start}
.term-list{display:grid;gap:2px;position:sticky;top:90px}
.term-list input{padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:var(--card);margin-bottom:6px}
.term{border:0;background:none;text-align:left;padding:6px 10px;border-radius:6px;cursor:pointer;display:flex;justify-content:space-between;gap:6px}
.term:hover{background:var(--line-soft)}
.term[aria-current="true"]{background:var(--card);box-shadow:var(--shadow);font-weight:500}
.src{font-size:11.5px;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 6px;width:max-content}
.aka{margin:-6px 0 14px;color:var(--muted)}
.pointer{font-family:var(--f-sans);font-size:13px;color:var(--muted);display:inline-flex;gap:6px;align-items:center;border:1px dashed var(--line);border-radius:6px;padding:4px 8px}

/* Drawer + modal */
.scrim{position:fixed;inset:0;background:rgba(15,20,28,.45);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--surface);z-index:41;overflow:auto;border-left:1px solid var(--line);box-shadow:var(--shadow);padding:calc(18px + env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) calc(30px + env(safe-area-inset-bottom,0px)) 20px}
.drawer-h{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:14px}
.drawer h2{font-family:var(--f-serif);font-weight:500;font-size:22px}
.region{border:1px solid var(--line);border-radius:8px;background:var(--card);margin-bottom:10px;overflow:hidden}
.region-h{display:flex;justify-content:space-between;gap:8px;padding:7px 12px;background:var(--line-soft);font-size:12.5px}
.region-h b{font-weight:600}
.region-h code{font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
.onode{display:grid;grid-template-columns:64px minmax(0,1fr);gap:8px;padding:5px 12px;font-size:13px;border-top:1px solid var(--line-soft)}
.onode .ref{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.onode.d2{padding-left:28px}
.onode.hit{background:var(--accent-soft)}
.onode.hit .t::after{content:"This entry";margin-left:8px;font-size:11px;color:var(--accent);font-weight:600}
.modal{position:fixed;inset:0;z-index:41;display:grid;place-items:center;padding:20px max(16px,env(safe-area-inset-right,0px)) 20px max(16px,env(safe-area-inset-left,0px));pointer-events:none}
.modal-box{pointer-events:auto;width:min(720px,100%);max-height:calc(100vh - 40px);overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:20px}
.modal-box h2{font-family:var(--f-serif);font-weight:500;font-size:22px}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin:14px 0}
.form-grid label{display:grid;gap:4px;font-size:12.5px;color:var(--muted)}
.form-grid input,.form-grid select{padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink);font-size:14px}
.file{display:flex;gap:10px;align-items:center;border:1px dashed var(--line);border-radius:8px;padding:12px;background:var(--card)}
.file .ico{width:34px;height:40px;border-radius:4px;background:var(--open);color:#fff;display:grid;place-items:center;font-family:var(--f-mono);font-size:10px;font-weight:600;flex:none}
.log{font-family:var(--f-mono);font-size:12.5px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:grid;gap:3px;margin:14px 0}
.log .ok::before{content:"✓ ";color:var(--held)}
.log .run::before{content:"… ";color:var(--muted)}
.check-item{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px;display:grid;gap:8px}
.check-item.done{border-color:var(--held)}
.check-item .where{font-size:12px;color:var(--muted);font-family:var(--f-mono)}
.check-item .txt{font-family:var(--f-serif);font-size:14px}
.check-item .ask-line{font-size:13.5px}
.check-item .ask-line b{font-weight:600}
.conf{font-family:var(--f-mono);font-size:12px;color:var(--comp)}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.actions select,.actions input{padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--card);min-width:0;flex:1 1 200px}
.resolved{font-size:13px;color:var(--held);font-weight:500}
.modal-f{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;margin-top:14px}
.queue-item{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px;display:grid;gap:8px;margin-bottom:10px}
.toggle-row{display:flex;justify-content:space-between;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px;margin-top:10px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:60;max-width:min(560px,calc(100% - 32px));font-size:13.5px;box-shadow:var(--shadow)}

@media (max-width:820px){
  .shell{grid-template-columns:minmax(0,1fr)}
  aside{display:none}
  .mobile-tree{display:block;margin-bottom:14px}
  .mobile-tree select{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card)}
  .mobile-tree .doc-row{display:flex;gap:6px;margin-bottom:8px;overflow-x:auto}
  .summary{grid-template-columns:minmax(0,1fr)}
  .defs{grid-template-columns:minmax(0,1fr)}
  .term-list{position:static}
  .entry-head h1{font-size:25px}
  .cards{grid-template-columns:minmax(0,1fr)}
  .bar-in{gap:8px}
}
@media (prefers-reduced-motion:no-preference){
  .card,.answer{animation:rise .25s ease-out both}
  @keyframes rise{from{transform:translateY(4px)}to{transform:none}}
}

function fmt(val,unit){
  if(val==null) return "";
  switch(unit){
    case "pct": return val+"%";
    case "gbp": return "£"+Number(val).toLocaleString("en-GB");
    case "months": return val+" months";
    case "days": return val+" business days";
    case "mult": return (val===1?"1x":val+"x")+" salary";
    case "count": return val===1?"1 investor director":val+" investor directors";
    default: return String(val);
  }
}
function median(a){const s=[...a].sort((x,y)=>x-y);const n=s.length;return n%2?s[(n-1)/2]:(s[n/2-1]+s[n/2])/2;}

/* ---------------- Text rendering ---------------- */
function lookupDef(m,term){
  const t=TERMS.find(x=>x.term===term||(x.aka||[]).includes(term));
  const w=t&&t.words[m];
  return w&&w.text?w:null;
}
function renderText(text,m,opts={}){
  if(text==="") return `<p class="gone">Clause deleted in this round.</p>`;
  const lines=text.split("\n");
  return lines.map(line=>{
    let h=esc(line).replace(/\{\{([^}]+)\}\}/g,(_,term)=>{
      const d=lookupDef(m,term);
      const shown=d&&d.called?d.called:term;
      if(!d) return `<span>${esc(shown)}</span>`;
      const body=d.text.replace(/^"[^"]+" means /,"").replace(/\n/g," ");
      return `<span class="xref" data-act="xref" title="Click to hide or show the definition">${esc(shown)}<span class="xdef">means ${esc(body)}</span></span>`;
    });
    const limb=/^\([a-z]{1,3}\)/.test(line);
    return `<p class="${limb?"limb":""}">${h}</p>`;
  }).join("");
}
function tokens(s){return (s.replace(/\{\{([^}]+)\}\}/g,"$1").match(/\S+|\s+/g))||[];}
function diffHtml(a,b){
  if(b==="") return `<p class="gone">Clause deleted in this round.</p>`;
  if(a==="") return `<p><ins>${esc(b.replace(/\{\{([^}]+)\}\}/g,"$1"))}</ins></p>`;
  const A=tokens(a),B=tokens(b),n=A.length,m=B.length;
  const dp=Array.from({length:n+1},()=>new Uint16Array(m+1));
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)dp[i][j]=A[i]===B[j]?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);
  let i=0,j=0,out="";
  while(i<n&&j<m){
    if(A[i]===B[j]){out+=esc(A[i]);i++;j++;}
    else if(dp[i+1][j]>=dp[i][j+1]){out+=`<del>${esc(A[i])}</del>`;i++;}
    else{out+=`<ins>${esc(B[j])}</ins>`;j++;}
  }
  while(i<n){out+=`<del>${esc(A[i++])}</del>`;}
  while(j<m){out+=`<ins>${esc(B[j++])}</ins>`;}
  return `<p>${out.replace(/<\/del><del>/g,"").replace(/<\/ins><ins>/g,"")}</p>`;
}

function outcomeCounts(vs){

    ${rounds}
    <div class="wording">${lead}${body}${v.partOf?`<p><button type="button" class="linkish" data-act="partof" data-k="${key}">Part of ${esc(v.partOf.title)}. See the whole clause</button></p>`:""}</div>
    <div class="card-f"><button type="button" class="btn ghost small" data-act="copy" data-k="${key}">Copy wording</button><button type="button" class="btn ghost small" data-act="source" data-k="${key}">Open matter</button>${moveBtn}${v.val!=null?`<span class="val">${esc(fmt(v.val,e.key.unit))}</span>`:""}</div>
    ${moving?`<div class="move-row"><select id="moveSel-${key.replace(/\W/g,"")}" aria-label="Move to heading">${opts}</select><button type="button" class="btn small primary" data-act="move-do" data-k="${key}">Move here</button><button type="button" class="btn small ghost" data-act="move-cancel">Cancel</button></div>`:""}
  </article>`;
}
function fmtDate(d){const [y,mo,da]=d.split("-");return `${+da} ${["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][+mo-1]} ${y}`;}

function parentView(e){
  const kids=e.children.map(byId);
  let h=`<p class="note" style="margin:-6px 0 12px">Open a part to compare it across matters and step through each round.</p><div class="parts">`;
  h+=kids.map(k=>{
    const c=outcomeCounts(k.v||[]);const tot=c.held+c.compromised+c.conceded+c.deleted||1;
    const mini=["held","compromised","conceded","deleted"].map(o=>c[o]?`<i style="width:${c[o]/tot*100}%;background:${OUT_C[o]}"></i>`:"").join("");
    const vals=(k.v||[]).filter(v=>v.val!=null).map(v=>v.val);
    const med=k.key&&vals.length?`Median ${fmt(roundNice(median(vals),k.key.unit),k.key.unit)}`:`${(k.v||[]).length} wordings`;
    return `<button type="button" class="part" data-act="entry" data-v="${k.id}"><b>${esc(k.title)}</b><span class="mini">${mini}</span><small>${esc(med)}</small></button>`;
  }).join("");
  h+=`</div>`;
  const ms=[...mattersOf(e)].filter(m=>{const mm=M[m];if(mm.precedent)return true;return (S.f.side==="all"||mm.side===S.f.side)&&(S.f.cp==="all"||mm.cp===S.f.cp);});
  const cards=ms.sort((a,b)=>M[b].date.localeCompare(M[a].date)).map(mk=>{
    const m=M[mk];
    const parts=kids.map(k=>{const v=(k.v||[]).find(x=>x.m===mk);if(!v) return "";const t=last(v)[2];return `<span class="part-label">${esc(k.title)}</span>${t===""?`<p class="gone">Deleted</p>`:renderText(t,mk)}`;}).join("");
    const lead=kids[0].leadIn?`<div class="lead">${renderText(kids[0].leadIn,mk)}</div>`:"";
    return `<article class="card${m.precedent?" prec":""}"><div class="card-h"><div class="row"><h3>${esc(m.name)}</h3>${m.precedent?`<span class="pill prec">Precedent</span>`:""}</div><div class="meta">${esc(m.client)}</div><div class="meta">${sideLine(m)}</div><div class="meta">${fmtDate(m.date)} · ${esc(m.doc)}</div></div><div class="wording">${lead}${parts}</div></article>`;
  }).join("");
  h+=`<div class="eyebrow" style="margin:6px 0 10px">The whole ${e.kind==="Long list"?"list":"clause"}, by matter</div>`;
  h+=filtersHtml(kids.flatMap(k=>k.v||[]),false);
  h+=cards?`<div class="cards">${cards}</div>`:`<div class="empty">${mattersOf(e).size?"No matters match these filters.":"No wordings filed under these parts yet."}</div>`;
  return h;
}

function definitionsView(){
  const q=S.termQ.toLowerCase();
  const list=TERMS.filter(t=>!q||t.term.toLowerCase().includes(q)||(t.aka||[]).some(a=>a.toLowerCase().includes(q)));
  const t=TERMS.find(x=>x.term===S.term)||TERMS[0];
  const items=list.map(x=>`<button type="button" class="term" data-act="term" data-v="${esc(x.term)}" aria-current="${x.term===t.term}"><span>${esc(x.term)}</span><span class="cnt">${Object.keys(x.words).length}</span></button>`).join("");
  const cards=sorted(Object.entries(t.words).map(([m,w])=>({m,w}))).map(({m,w})=>{
    const mm=M[m];
    const body=w.pointer?`<span class="pointer">Has the meaning given in ${esc(w.pointer)}</span>`:renderText(w.text,m);
    return `<article class="card${mm.precedent?" prec":""}"><div class="card-h"><div class="row"><h3>${esc(mm.name)}</h3><span class="src">${esc(w.src)}</span></div><div class="meta">${esc(mm.client)}</div>${w.called?`<div><span class="tag">Called "${esc(w.called)}" in this matter</span></div>`:""}</div><div class="wording">${body}</div><div class="card-f"><button type="button" class="btn ghost small" data-act="copy-def" data-t="${esc(t.term)}" data-m="${m}">Copy wording</button><button type="button" class="btn ghost small" data-act="source" data-k="defs|${m}">Open matter</button></div></article>`;
  }).join("");
  const aka=t.aka?`<p class="aka">Also appears as ${t.aka.map(a=>`"${esc(a)}"`).join(", ")}. Linked automatically because the meaning matches.</p>`:"";
  const inline=t.inline?`<p class="aka">Defined inline in the body of each document, not in the definitions clause.</p>`:"";
  return `<p class="note" style="margin:-6px 0 14px">Each defined term is its own entry, including terms defined inline and in schedules. Limbs stay inside their definition.</p>
  <div class="defs"><div class="term-list"><input id="termQ" type="search" placeholder="Find a term" aria-label="Find a term" value="${esc(S.termQ)}">${items||`<p class="note">No terms match.</p>`}</div>
  <div><h2 style="font-family:var(--f-serif);font-weight:500;font-size:22px;margin-bottom:10px">${esc(t.term)}</h2>${aka}${inline}<div class="cards">${cards}</div></div></div>`;
}

/* ---------------- Ask ---------------- */
function answerFor(q){
  const hit=QA.find(x=>x.k.test(q));
  if(!hit) return {q,none:true};
  const e=byId(hit.e);
  const vals=(e.v||[]).filter(v=>v.val!=null&&!M[v.m].precedent).map(v=>v.val);
  const u=e.key.unit;
  const mid=roundNice(median(vals),u), lo=Math.min(...vals), hi=Math.max(...vals);
  const a=lo===hi?`Usually ${fmt(mid,u)}.`:`Usually ${fmt(mid,u)}, ranging from ${fmt(lo,u)} to ${fmt(hi,u)}.`;
  const mk=MARKET[e.id];
  let mkt;
  if(!S.optIn) mkt={none:"Your firm has not opted in to benchmarks, so no market view is shown."};
  else if(!mk||mk.firms<5||mk.matters<20) mkt={none:"Not enough market data yet to show a benchmark for this."};
  else mkt={text:mk.lo===mk.hi?`Usually ${fmt(mk.mid,u)}.`:`Usually ${fmt(mk.mid,u)}, ranging from ${fmt(mk.lo,u)} to ${fmt(mk.hi,u)}.`};
  return {q,a,mkt,e:e.id};
}
function answerHtml(){
  const A=S.answer;
  const close=`<button type="button" class="btn ghost small" data-act="answer-close" aria-label="Close answer">Close</button>`;
  if(A.none){
    return `<div class="panel answer"><div class="row"><p class="q">${esc(A.q)}</p>${close}</div><p class="a">I couldn't match that to a heading yet.</p><div class="suggest">${suggestions()}</div></div>`;
  }
  return `<div class="panel answer"><div class="row"><p class="q">${esc(A.q)}</p>${close}</div>
    <p class="src">Our firm</p><p class="a">${esc(A.a)}</p>
    <div class="mkt"><span class="src">Market benchmark</span>${A.mkt.text?`<span>${esc(A.mkt.text)}</span>`:`<span class="note" style="margin:0">${esc(A.mkt.none)}</span>`}</div>
    <div class="suggest">${A.e!==S.entry?`<button type="button" class="chip" data-act="entry" data-v="${A.e}">Open the entry</button>`:""}${suggestions(A.q)}</div></div>`;
}
function suggestions(skip){return QA.filter(x=>x.q&&x.q!==skip).slice(0,4).map(x=>`<button type="button" class="chip" data-act="ask" data-v="${esc(x.q)}">${esc(x.q)}</button>`).join("");}

/* ---------------- Drawers and modals ---------------- */
function openOverlay(html,kind){

function outlineBody(doc,loc){

}
function outlineHtml(doc,loc,title){

  <p class="note" style="margin:0 0 14px">Each part has its own place in the outline. Paragraph 10 of a schedule is never confused with clause 10 of the body, and every level of numbering is kept.</p>${regions}`;

/* Upload flow */
function uploadHtml(){
  const U=S.upload;
  if(U.step==="form") return `<div class="drawer-h" style="margin-bottom:6px"><div><div class="eyebrow">Upload</div><h2>Add a document to a matter</h2></div><button type="button" class="btn small" data-act="close">Close</button></div>
    <div class="file"><span class="ico">DOCX</span><div><b>Ferngrove Energy - SHA v1 (ours).docx</b><div class="meta">Sample file for this demo · 84 KB</div></div></div>
    <form id="upForm"><div class="form-grid">
      <label for="upMatter">Matter<input id="upMatter" value="Ferngrove Energy Series A"></label>
      <label for="upClient">Client<input id="upClient" value="Ferngrove Energy Ltd"></label>
      <label for="upSide">Side we act for<select id="upSide"><option>Company</option><option>Investor</option></select></label>
      <label for="upCp">Counterparty<input id="upCp" value="Harbourline Capital"></label>
    </div><p class="note">For historical uploads this short form is filled in once per matter. Outcomes for signed-only documents are left as unknown.</p>
    <div class="modal-f"><span></span><button type="submit" class="btn primary">Upload and file</button></div></form>`;
  if(U.step==="parsing"){
    const L=["Reading the Word structure and numbering","Found 6 regions: front, definitions, body, 2 schedules, execution","Split into 214 parts, down to the deepest level","Following each clause by its wording, not its number","Filing each part under a heading"];
    return `<div class="eyebrow">Upload</div><h2>Splitting and filing</h2><div class="log">${L.map((l,i)=>`<div class="${i<U.tick?"ok":"run"}">${esc(l)}</div>`).slice(0,Math.min(U.tick+1,L.length)).join("")}</div>`;
  }
  if(U.step==="check"){
    const items=UP_ITEMS.map(it=>{
      const d=U.dec[it.id];
      const s=byId(it.suggest);
      const sName=pathName(s);
      const opts=headingOptions("sha");
      let act;
      if(d){
        const where=d.kind==="propose"?`a proposed new part "${d.name}" of ${pathName(byId(d.parent).parent?byId(byId(d.parent).parent):byId(d.parent))} (waiting for a firm admin)`:pathName(byId(d.target));
        act=`<div class="actions"><span class="resolved">Filed under ${esc(where)}</span><button type="button" class="btn ghost small" data-act="up-undo" data-v="${it.id}">Change</button></div>`;
      } else if(U.mode[it.id]==="other"){
        act=`<div class="actions"><select id="sel-${it.id}" aria-label="Choose a clause type">${opts}</select><button type="button" class="btn small primary" data-act="up-other" data-v="${it.id}">File here</button></div>
        <div class="actions"><input id="prop-${it.id}" placeholder="Or propose a new part of it, e.g. Capital expenditure" aria-label="New part name"><button type="button" class="btn small" data-act="up-propose" data-v="${it.id}">Propose part</button><button type="button" class="btn small ghost" data-act="up-cancel" data-v="${it.id}">Back</button></div>`;
      } else {
        act=`<div class="actions"><button type="button" class="btn small primary" data-act="up-agree" data-v="${it.id}">Agree</button><button type="button" class="btn small" data-act="up-choose" data-v="${it.id}">Choose another heading</button></div>`;
      }
      return `<div class="check-item${d?" done":""}"><div class="where">${esc(it.where)}</div>${it.lead?`<div class="txt" style="color:var(--faint);font-style:italic;font-size:13px">${esc(it.lead.replace(/\{\{|\}\}/g,""))}</div>`:""}<div class="txt">${esc(it.text)}</div>
        <div class="ask-line">We think this should be filed under <b>${esc(s.group)} › ${esc(sName)}</b>. Do you agree? <span class="conf">${it.conf}% sure</span></div>${act}</div>`;
    }).join("");
    const left=UP_ITEMS.filter(it=>!U.dec[it.id]).length;
    return `<div class="drawer-h"><div><div class="eyebrow">Upload · Ferngrove Energy Series A</div><h2>4 clauses need your decision</h2></div><button type="button" class="btn small" data-act="close">Close</button></div>
      <p class="note" style="margin:0 0 12px">210 of 214 parts were filed automatically because the AI was at least 85% sure. Your answer here is final for these four.</p>${items}
      <div class="modal-f"><span class="note" style="margin:0">${left?`${left} left to decide`:"All decided"}</span><button type="button" class="btn primary" data-act="up-finish" ${left?'aria-disabled="true"':""}>Finish and add to the library</button></div>`;
  }
}
function finishUpload(){
  const U=S.upload;
  M.fer={name:"Ferngrove Energy Series A", client:U.client, side:U.side, cp:U.cp, date:"2026-10-19", doc:"v1 ours (in negotiation)"};
  byId("drag-threshold").v.push({m:"fer",o:"open",r:[R("v1 ours",us,dragT("75%"))]});
  byId("consent-borrowing").v.push({m:"fer",o:"open",r:[R("v1 ours",us,borrow("£150,000"))]});
  UP_ITEMS.forEach(it=>{
    const d=U.dec[it.id];
    if(d.kind==="propose"){S.proposals.push({name:d.name,parent:d.parent,item:it});}
    else byId(d.target).v.push({m:"fer",o:"open",r:[R("v1 ours",us,it.text)]});
  });
  S.uploaded=true; S.upload=null;
  closeOverlay(); renderAll();
  toast(S.proposals.length?`Added to the library. ${S.proposals.length} new part${S.proposals.length>1?"s":""} sent to a firm admin for approval.`:"Added to the library. Ferngrove Energy now appears under its headings.");
}

function renderRole(){

let toastT;
function toast(msg){const t=$("#toast");t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>{t.hidden=true;},3600);}
function goEntry(id){const e=byId(id);S.entry=id;S.doc=e.doc;S.moving=null;S.addPart=null;S.f={side:"all",outcome:"all",cp:"all"};renderAll();window.scrollTo({top:0});}
function findV(key){const [eid,m]=key.split("|");return {e:byId(eid),v:(byId(eid).v||[]).find(x=>x.m===m),m};}
function doAsk(q){if(!q.trim())return;S.answer=answerFor(q.trim());$("#askInput").value=q;renderMain();window.scrollTo({top:0});}

document.addEventListener("click",ev=>{
  const b=ev.target.closest("[data-act]");if(!b) return;
  const a=b.dataset.act, v=b.dataset.v;
  if(a==="xref"){b.classList.toggle("closed");return;}
  if(a==="doc"){const de=docEntries(v);const first=(v==="sha"&&byId("drag-threshold"))||de.find(e=>isLeaf(e)&&e.key)||de.find(e=>mattersOf(e).size)||de.find(isLeaf);if(first){goEntry(first.id);}else{S.doc=v;S.entry=null;renderAll();}return;}
  if(a==="part-open"){S.addPart=S.entry;renderMain();const i=$("#partName");if(i)i.focus();return;}
  if(a==="part-cancel"){S.addPart=null;renderMain();return;}
  if(a==="term-jump"){S.term="Investor Majority";goEntry("defs");return;}
  if(a==="entry"){goEntry(v);return;}
  if(a==="term"){S.term=v;renderMain();return;}
  if(a==="role"){S.role=v;S.moving=null;S.propose=false;try{localStorage.setItem("cl-role",v);}catch(e){}renderAll();toast(v==="admin"?"Viewing as a firm admin.":"Viewing as an associate.");return;}
  if(a==="round"){S.rounds[b.dataset.k]=+b.dataset.i;renderMain();return;}
  if(a==="copy"){const {v:vv}=findV(b.dataset.k);copy(last(vv)[2].replace(/\{\{([^}]+)\}\}/g,"$1"));return;}
  if(a==="copy-def"){const t=TERMS.find(x=>x.term===b.dataset.t);const w=t.words[b.dataset.m];copy(w.text||`Has the meaning given in ${w.pointer}.`);return;}
  if(a==="source"){const [eid,m]=b.dataset.k.split("|");openOverlay(sourceHtml(byId(eid),m),"drawer");return;}
  if(a==="outline"){const e=byId(S.entry);openOverlay(outlineHtml(e.doc,e.loc,DOCS[e.doc]),"drawer");return;}
  if(a==="partof"){const {v:vv,m}=findV(b.dataset.k);openOverlay(`<div class="drawer-h"><div><div class="eyebrow">${esc(M[m].name)}</div><h2>${esc(vv.partOf.title)}</h2></div><button type="button" class="btn small" data-act="close">Close</button></div><p class="note" style="margin:0 0 12px">This clause covers more than one topic, so each part is filed under its own heading and links back here.</p><div class="panel wording">${renderText(vv.partOf.text,m)}</div>`,"drawer");return;}
  if(a==="close"){closeOverlay();S.upload=null;return;}
  if(a==="move-denied"){toast("Only a firm admin can move a clause. Switch to Firm admin at the top to try it.");return;}
  if(a==="move"){S.moving=b.dataset.k;renderMain();return;}
  if(a==="move-cancel"){S.moving=null;renderMain();return;}
  if(a==="move-do"){const key=b.dataset.k;const {e,v:vv}=findV(key);const target=$("#moveSel-"+key.replace(/\W/g,"")).value;e.v=e.v.filter(x=>x!==vv);byId(target).v.push(vv);S.moving=null;renderAll();toast(`Moved to ${byId(target).title}. Future documents at this firm will be filed the same way.`);return;}
  if(a==="answer-close"){S.answer=null;renderMain();return;}
  if(a==="ask"){doAsk(v);return;}
  if(a==="upload"){S.upload={step:"form",dec:{},mode:{}};openOverlay(uploadHtml(),"modal");return;}
  if(a==="up-agree"){S.upload.dec[v]={kind:"agree",target:UP_ITEMS.find(x=>x.id===v).suggest};refreshUpload();return;}
  if(a==="up-choose"){S.upload.mode[v]="other";refreshUpload();return;}
  if(a==="up-cancel"){S.upload.mode[v]=null;refreshUpload();return;}
  if(a==="up-undo"){delete S.upload.dec[v];S.upload.mode[v]=null;refreshUpload();return;}
  if(a==="up-other"){S.upload.dec[v]={kind:"other",target:$("#sel-"+v).value};refreshUpload();return;}
  if(a==="up-propose"){const n=$("#prop-"+v).value.trim();if(!n){toast("Give the new part a name first.");return;}S.upload.dec[v]={kind:"propose",name:n,parent:$("#sel-"+v).value};refreshUpload();return;}
  if(a==="up-finish"){if(b.getAttribute("aria-disabled")==="true"){toast("Decide each clause first.");return;}finishUpload();return;}
  if(a==="queue"){openOverlay(queueHtml(),"drawer");return;}
  if(a==="optin"){S.optIn=!S.optIn;if(S.answer&&!S.answer.none)S.answer=answerFor(S.answer.q);openOverlay(queueHtml(),"drawer");renderMain();toast(S.optIn?"Benchmarks on.":"Benchmarks off. Market views are hidden.");return;}
  if(a==="q-approve"){const p=S.proposals.splice(+v,1)[0];const id=addPart(p.parent,p.name,p.item);renderAll();openOverlay(queueHtml(),"drawer");toast(`"${p.name}" approved. It now appears as a firm-only part of ${byId(byId(id).parent).title}.`);return;}
  if(a==="q-reject"){const p=S.proposals.splice(+v,1)[0];if(p.item) byId(p.item.suggest).v.push({m:"fer",o:"open",r:[R("v1 ours",us,p.item.text)]});renderAll();openOverlay(queueHtml(),"drawer");toast(p.item?"Rejected. The clause was filed under the AI's suggestion.":"Rejected.");return;}
});

document.addEventListener("change",ev=>{
  const t=ev.target;
  if(t.dataset&&t.dataset.filter){S.f[t.dataset.filter]=t.value;renderMain();return;}
  if(t.id==="fChanges"){S.changes=t.checked;renderMain();return;}
  if(t.id==="mobileSel"){goEntry(t.value);return;}
  if(t.id==="onlyFilled"){S.onlyFilled=t.checked;renderSide();return;}
});
document.addEventListener("input",ev=>{
  if(ev.target.id==="termQ"){S.termQ=ev.target.value;const pos=ev.target.selectionStart;renderMain();const i=$("#termQ");i.focus();try{i.setSelectionRange(pos,pos);}catch(e){}}
});
document.addEventListener("submit",ev=>{
  ev.preventDefault();
  const f=ev.target;
  if(f.id==="askForm"){doAsk($("#askInput").value);return;}
  if(f.id==="partForm"){const n=$("#partName").value.trim();if(!n)return;const pid=S.addPart;S.addPart=null;
    if(S.role==="admin"){const id=addPart(pid,n,null);renderAll();toast(`Added "${n}" as a firm-only part of ${byId(byId(id).parent).title}.`);}
    else{S.proposals.push({name:n,parent:pid,item:null});renderAll();toast(`"${n}" sent to a firm admin for approval.`);}
    return;}
  if(f.id==="upForm"){
    const U=S.upload;U.client=$("#upClient").value;U.side=$("#upSide").value;U.cp=$("#upCp").value;U.step="parsing";U.tick=0;refreshUpload();
    const iv=setInterval(()=>{U.tick++;if(U.tick>=5){clearInterval(iv);U.step="check";}if(S.upload===U)refreshUpload();else clearInterval(iv);},550);
  }
});
document.addEventListener("toggle",ev=>{const d=ev.target;if(d&&d.dataset&&d.dataset.g!==undefined)S.groupOpen[d.dataset.g]=d.open;},true);
document.addEventListener("keydown",ev=>{if(ev.key==="Escape"&&!$("#overlay").hidden){closeOverlay();S.upload=null;}});
function copy(text){
  const done=()=>toast("Wording copied.");
  try{navigator.clipboard.writeText(text).then(done,()=>toast("Couldn't copy here. Select the wording and copy it instead."));}
  catch(e){toast("Couldn't copy here. Select the wording and copy it instead.");}
}

renderAll();
</script>

</body></html>
