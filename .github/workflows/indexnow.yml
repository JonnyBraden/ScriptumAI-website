name: IndexNow ping (Bing and others)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      all:
        description: "Submit every sitemap URL"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: indexnow
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Netlify takes about 80 seconds to publish main. Give it a head start,
      # then --wait polls until the key file and every URL return 200.
      - name: Wait for Netlify deploy
        run: sleep 90
      - name: Submit all URLs (manual run)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.all }}
        run: python3 scripts/indexnow.py --all --wait
      - name: Submit changed URLs
        if: ${{ github.event_name == 'push' }}
        run: |
          BASE="${{ github.event.before }}"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE="$(git rev-parse HEAD~1)"
          fi
          python3 scripts/indexnow.py --changed "$BASE" "${{ github.sha }}" --wait
